name: Render 25 Nov mortgage Instagram post
on:
  push:
    paths:
      - .github/workflows/render-mortgage-25nov.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: sudo apt-get update -qq && sudo apt-get install -y librsvg2-bin fonts-dejavu-core
      - name: Render JPEG
        run: |
          rsvg-convert -w 1080 -h 1350 public/instagram/konut_kredisi_faiz_karsilastirma_20261125.svg -o /tmp/post.png
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/post.png').convert('RGB')
          assert im.size==(1080,1350)
          im.save('public/instagram/konut_kredisi_faiz_karsilastirma_20261125.jpg',quality=92,optimize=True)
          PY
      - name: Commit JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/instagram/konut_kredisi_faiz_karsilastirma_20261125.jpg
          git commit -m "Render 25 November mortgage infographic"
          git push
