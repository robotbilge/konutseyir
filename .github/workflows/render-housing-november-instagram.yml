name: Render housing November Instagram image
on:
  push:
    paths:
      - .github/workflows/render-housing-november-instagram.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: sudo apt-get update -qq && sudo apt-get install -y librsvg2-bin fonts-dejavu-core
      - name: Render JPEG and verify
        run: |
          rsvg-convert -w 1080 -h 1350 public/instagram/konut_piyasasi_ekim_2026_post.svg -o /tmp/konut_piyasasi.png
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/konut_piyasasi.png').convert('RGB')
          assert im.size == (1080,1350)
          im.save('public/instagram/konut_piyasasi_ekim_2026_post.jpg',quality=91,optimize=True)
          print('JPEG OK',im.size)
          PY
      - name: Commit rendered image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/instagram/konut_piyasasi_ekim_2026_post.jpg
          git commit -m "Render housing market Instagram post"
          git push
