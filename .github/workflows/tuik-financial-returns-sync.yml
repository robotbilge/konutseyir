name: TÜİK finansal getiri verisini güncelle
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/tuik-financial-returns-sync.yml
      - scripts/sync-tuik-financial-returns.mjs
      - worker/financial-returns.mjs
      - migrations/0006_financial_returns.sql
  schedule:
    - cron: '20 8 8-10 * *'
permissions:
  contents: read
concurrency:
  group: konutseyir-tuik-financial-returns-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ea5e08f7044d873900c9c8b6b4cfdb8f
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Credentials check
        run: |
          test -n "$TUIK_API_KEY"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Apply D1 schema
        run: pnpm exec wrangler d1 migrations apply konutseyir-data --remote --config worker/wrangler.jsonc
      - name: Download TÜİK observations
        shell: bash
        run: |
          token_http=$(curl --silent --show-error --max-time 45 --output token.json --write-out "%{http_code}" \
            --request POST "https://giris.tuik.gov.tr/realms/web/protocol/openid-connect/token" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=password" \
            --data-urlencode "client_id=nsi-ws-consumer" \
            --data-urlencode "api_key=$TUIK_API_KEY")
          test "$token_http" = "200"
          token=$(jq -r '.access_token // empty' token.json)
          test -n "$token"
          echo "::add-mask::$token"
          start=$(date -u -d '18 months ago' +%Y-%m)
          end=$(date -u +%Y-%m)
          data_http=$(curl --silent --show-error --retry 2 --retry-all-errors --max-time 90 \
            --output tuik-financial-returns.csv --write-out "%{http_code}" \
            "https://nsiws.tuik.gov.tr/rest/data/TR,DF_FINANSAL_YATIRIM_ARAC_REEL_GETIRI,1.0/?startPeriod=$start&endPeriod=$end" \
            --header "Authorization: Bearer $token" --header "Accept: text/csv")
          test "$data_http" = "200"
      - name: Validate rows and prepare SQL
        run: node scripts/sync-tuik-financial-returns.mjs
      - name: Store verified observations in D1
        run: pnpm exec wrangler d1 execute konutseyir-data --remote --config worker/wrangler.jsonc --file tuik-financial-returns.sql
