name: TÜİK konut satışlarını güncelle
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/tuik-sync.yml
      - scripts/sync-tuik.mjs
      - worker/tuik.mjs
      - migrations/0003_city_sales.sql
  schedule:
    - cron: '15 8 18 * *'
permissions:
  contents: read
concurrency:
  group: konutseyir-tuik-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ea5e08f7044d873900c9c8b6b4cfdb8f
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Yapılandırmayı doğrula
        run: |
          test -n "$TUIK_API_KEY"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: D1 şemasını uygula
        run: pnpm exec wrangler d1 migrations apply konutseyir-data --remote --config worker/wrangler.jsonc
      - name: TÜİK son iki ayı indir
        shell: bash
        run: |
          token_http=$(curl --silent --show-error --max-time 45 --output token.json --write-out "%{http_code}" \
            --request POST "https://giris.tuik.gov.tr/realms/web/protocol/openid-connect/token" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=password" \
            --data-urlencode "client_id=nsi-ws-consumer" \
            --data-urlencode "api_key=$TUIK_API_KEY")
          test "$token_http" = "200"
          token=$(jq -r '.access_token // empty' token.json)
          test -n "$token"
          echo "::add-mask::$token"
          mkdir -p tuik-data
          for offset in 2 1; do
            period=$(date -u -d "$offset months ago" +%Y-%m)
            data_http=$(curl --silent --show-error --retry 2 --retry-all-errors --max-time 60 \
              --output "tuik-data/$period.csv" --write-out "%{http_code}" \
              "https://nsiws.tuik.gov.tr/rest/data/TR,DF_SATIS_SEKLI_DURUMU_ILILCE_V3,1.0/?startPeriod=$period&endPeriod=$period" \
              --header "Authorization: Bearer $token" --header "Accept: text/csv")
            if [ "$data_http" != "200" ]; then
              echo "TÜİK $period alınamadı: HTTP $data_http"
              rm -f "tuik-data/$period.csv"
            fi
          done
          test -n "$(find tuik-data -name '*.csv' -print -quit)"
          for file in tuik-data/*.csv; do
            echo "İstanbul konut satış kodları: $file"
            awk -F, 'NR == 1 || ($4 == "TR100" && $11 == "MII_KSS")' "$file" | head -n 12
          done
      - name: TÜİK verisini doğrula ve SQL hazırla
        run: node scripts/sync-tuik.mjs
      - name: Doğrulanmış satışları D1'e yaz
        run: pnpm exec wrangler d1 execute konutseyir-data --remote --config worker/wrangler.jsonc --file tuik-city-sales.sql
