name: Test and deploy KonutSeyir
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: konutseyir-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ea5e08f7044d873900c9c8b6b4cfdb8f
      EVDS_CPI_SERIES: ${{ vars.EVDS_CPI_SERIES }}
      EVDS_HOUSING_SERIES: ${{ vars.EVDS_HOUSING_SERIES }}
      EVDS_DEPOSIT_SERIES: ${{ vars.EVDS_DEPOSIT_SERIES }}
      VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Check deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wrangler d1 migrations apply konutseyir-data --remote --config worker/wrangler.jsonc
      - run: pnpm exec wrangler deploy --config worker/wrangler.jsonc
      - run: pnpm build
      - name: Ensure Pages project exists
        continue-on-error: true
        run: pnpm exec wrangler pages project create konutseyir --production-branch main
      - run: pnpm exec wrangler pages deploy dist --project-name konutseyir --branch main
